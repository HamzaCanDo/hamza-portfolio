name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Sync repository root to cPanel
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Upload website files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_HOST }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: /home/kitbinto/hamzaa.top/
          log-level: minimal
          exclude: |
            **/.git*
            **/.github/**
            **/.idea/**
            **/.vscode/**
            **/.env
            **/.env.*
            **/config.php
            **/database.php
            **/db_config.php
            **/instamojo.php
            **/error_log
            **/*.log
            **/*.tmp
            **/*.bak
            **/.ftp-deploy-sync-state.json
