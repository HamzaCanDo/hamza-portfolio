          },

          }
        }

  <!-- Production React + Babel -->
  <script defer src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.20.15/babel.min.js"></script>

  <!-- Google Fonts: Inter + multilingual Noto Sans for international greetings -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Noto+Sans+Arabic&family=Noto+Sans+Bengali&family=Noto+Sans+Devanagari&family=Noto+Sans+Gurmukhi&family=Noto+Sans+Hebrew&family=Noto+Sans+Tamil&family=Noto+Sans+Thai&display=swap"
    rel="stylesheet">

  <style>    /* ==========================================================================
       DESIGN SYSTEM: Refined Frosted Glass · Apple-Inspired Minimal
       ========================================================================== */

    :root {
      --bg-canvas: #F4F7FB;
      --bg-canvas-2: #EDF2F9;

      --accent: #0284C7;
      --accent-strong: #0369A1;
      --accent-soft: rgba(2, 132, 199, 0.10);
      --accent-soft-2: rgba(2, 132, 199, 0.16);

      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-tertiary: #94A3B8;

      --surface: rgba(255, 255, 255, 0.58);
      --surface-strong: rgba(255, 255, 255, 0.74);
      --surface-hover: rgba(255, 255, 255, 0.82);

      --border: rgba(148, 163, 184, 0.22);
      --border-strong: rgba(148, 163, 184, 0.40);

      --shadow-xs: 0 1px 2px rgba(2, 6, 23, 0.04);
      --shadow-sm: 0 1px 2px rgba(2, 6, 23, 0.05), 0 8px 24px -12px rgba(2, 6, 23, 0.12);
      --shadow-md: 0 24px 52px -28px rgba(2, 6, 23, 0.24);

      --radius-lg: 20px;
      --radius-xl: 28px;

      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --font-display: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    .bg-bg-canvas {
      background-color: transparent !important;
    }

    /* Keep the initial viewport responsive while preserving layout space below it. */
    #skills,
    #projects,
    #about,
    #contact,
    #Resume {
      content-visibility: auto;
      contain-intrinsic-size: auto 720px;
    }

    /* Calm, soft ambient backdrop (replaces the busy cityscape photo) */
    .cityscape-background {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(42rem 34rem at 12% 6%, rgba(14, 165, 233, 0.14), transparent 62%),
        radial-gradient(38rem 30rem at 88% 16%, rgba(99, 102, 241, 0.11), transparent 62%),
        radial-gradient(46rem 38rem at 50% 100%, rgba(56, 189, 248, 0.10), transparent 66%),
        linear-gradient(180deg, var(--bg-canvas) 0%, var(--bg-canvas-2) 100%);
    }

    .nature-video-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background: linear-gradient(180deg, rgba(2, 6, 23, 0.00), rgba(2, 6, 23, 0.02));
    }

    /* Soft, restrained ambient glow orbs */
    .bg-orb {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      will-change: transform;
      opacity: 0.72;
    }

    .bg-orb-1 {
      width: 560px;
      height: 560px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.16) 0%, transparent 68%);
      filter: blur(80px);
      top: -14%;
      left: -8%;
      animation: drift-1 26s ease-in-out infinite alternate;
    }

    .bg-orb-2 {
      width: 520px;
      height: 520px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.14) 0%, transparent 68%);
      filter: blur(80px);
      bottom: 6%;
      right: -8%;
      animation: drift-2 30s ease-in-out infinite alternate;
    }

    .bg-orb-3 {
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.12) 0%, transparent 68%);
      filter: blur(78px);
      top: 46%;
      left: 30%;
      animation: drift-3 32s ease-in-out infinite alternate;
    }

    @keyframes drift-1 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 30px) scale(1.06); }
    }
    @keyframes drift-2 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-35px, -40px) scale(1.05); }
    }
    @keyframes drift-3 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-25px, 30px) scale(0.96); }
    }

    /* Subtle grain for depth only — kept extremely faint */
    .noise-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0.014;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* ==========================================================================
       Frosted Glass Card System (subtle, readable, depth without noise)
       ========================================================================== */

    .crystal-card {
      position: relative;
      border-radius: var(--radius-xl);
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--surface);
      -webkit-backdrop-filter: blur(18px) saturate(150%);
      backdrop-filter: blur(18px) saturate(150%);
      box-shadow: var(--shadow-sm);
      transition: transform 0.35s var(--ease), box-shadow 0.35s var(--ease), background-color 0.35s var(--ease), border-color 0.35s var(--ease);
      isolation: isolate;
      width: 100%;
    }

    .crystal-card::before,
    .crystal-card::after {
      content: none;
    }

    .crystal-card:hover {
      transform: translateY(-3px);
      background: var(--surface-hover);
      border-color: var(--border-strong);
      box-shadow: var(--shadow-md);
    }

    /* Project card glow variants: now a subtle tinted hover ring only */
    .project-card-purple,
    .project-card-sky,
    .project-card-cyan {
      --project-tint: rgba(2, 132, 199, 0.08);
    }
    .project-card-purple::before,
    .project-card-sky::before,
    .project-card-cyan::before {
      content: none;
    }

    /* ==========================================================================
       Hero Section & Cinematic Portrait Integration
       ========================================================================== */

    #home {
      /* Percentage min-height so the section is never shorter than the viewport at
         embedded/zoomed widths (svh alone collapses inside a scrolled ancestor). */
      min-height: 100vh;
      min-height: 100svh;
      position: relative;
      isolation: isolate;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      overflow: hidden;
      background-color: #070B14;
      padding-top: 5.5rem;
      /* Full-bleed: escape the centred max-w wrapper so the dark panel spans the viewport. */
      width: 100vw;
      margin-inline: calc(50% - 50vw);
      border-radius: 0;
    }

    .hero-background {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .hero-image {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-52%);
      height: 105%;
      max-height: 1020px;
      width: auto;
      max-width: 70vw;
      object-fit: contain;
      object-position: right center;
      background-color: transparent;
      transition: transform 0.6s var(--ease);
      filter: drop-shadow(-12px 0 32px rgba(0, 0, 0, 0.5));
      mask-image: linear-gradient(to right, transparent 0%, rgba(0, 0, 0, 0.5) 12%, rgba(0, 0, 0, 1) 28%);
      -webkit-mask-image: linear-gradient(to right, transparent 0%, rgba(0, 0, 0, 0.5) 12%, rgba(0, 0, 0, 1) 28%);
    }

    /* Ambient directional scrim overlay:
       Protects left-side text completely, transitions smoothly across center,
       and lets the developer portrait on the right shine through in rich detail. */
    .hero-content-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: linear-gradient(
        to right,
        rgba(7, 11, 20, 0.95) 0%,
        rgba(7, 11, 20, 0.80) 28%,
        rgba(7, 11, 20, 0.35) 48%,
        rgba(7, 11, 20, 0.05) 65%,
        transparent 100%
      );
    }

    /* Hero ambient glow effects */
    .hero-ambient-glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.45;
    }

    .hero-ambient-glow--cyan {
      width: 550px;
      height: 550px;
      background: radial-gradient(circle, rgba(14, 165, 233, 0.22) 0%, transparent 70%);
      top: 5%;
      right: 15%;
    }

    .hero-ambient-glow--indigo {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.20) 0%, transparent 70%);
      bottom: 5%;
      right: 5%;
    }

    /* Desktop copy positioning — aligns with the max-w-[1380px] + px-10 content grid */
    .hero-copy {
      position: relative;
      z-index: 10;
      width: min(52%, 750px);
      margin-left: max(1.25rem, calc((100vw - 1380px) / 2 + 2.5rem));
      padding: 3rem 0 2rem;
    }

    .hero-copy h1 {
      margin-bottom: 1.25rem;
      /* Capped so "Full Stack Web Developer" breaks 2 lines instead of leaving the
         single-word orphan "Developer" on its own line. */
      font-size: clamp(2.3rem, 4.1vw, 3.6rem);
      line-height: 1.06;
      letter-spacing: -0.04em;
      color: #FFFFFF;
      text-wrap: balance;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.6);
    }

    .hero-copy h1 span:not(.gradient-text-hero) {
      color: rgba(241, 245, 249, 0.96);
    }

    .hero-copy h1 .gradient-text-hero {
      background: linear-gradient(135deg, #38BDF8 0%, #60A5FA 50%, #818CF8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      color: #38BDF8;
      filter: drop-shadow(0 2px 8px rgba(56, 189, 248, 0.3));
    }

    .hero-copy h3 {
      max-width: 48ch;
      margin-bottom: 1.5rem;
      font-size: clamp(1rem, 1.35vw, 1.18rem);
      line-height: 1.68;
      color: rgba(226, 232, 240, 0.90);
      text-wrap: pretty;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
    }

    /* Tech highlight tags */
    .hero-tech-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-bottom: 1.75rem;
    }

    .hero-tech-pill {
      font-size: 0.76rem;
      font-weight: 500;
      color: rgba(226, 232, 240, 0.85);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 9999px;
      padding: 0.25rem 0.65rem;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: all 0.2s var(--ease);
    }

    .hero-tech-pill:hover {
      background: rgba(56, 189, 248, 0.16);
      border-color: rgba(56, 189, 248, 0.35);
      color: #FFFFFF;
      transform: translateY(-1px);
    }

    /* Inline icon marquee carousel — sits next to the greeting pill */
    .hero-floating-badge {
      display: flex;
      align-items: center;
      overflow: hidden;
      width: min(300px, 36vw);
      height: 42px;
      padding: 0;
      background: rgba(15, 23, 42, 0.68);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 9999px;
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.32), inset 0 1px 0 rgba(255,255,255,0.08);
      transition: border-color 0.25s var(--ease);
      mask-image: linear-gradient(to right, transparent 0%, black 12%, black 88%, transparent 100%);
      -webkit-mask-image: linear-gradient(to right, transparent 0%, black 12%, black 88%, transparent 100%);
      flex-shrink: 0;
    }

    .hero-floating-badge:hover {
      border-color: rgba(56, 189, 248, 0.45);
    }

    /* Unused dot kept for compatibility */
    .hero-floating-badge-dot { display: none; }

    /* Icon marquee track */
    .icon-marquee-track {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 0 10px;
      animation: icon-marquee 28s linear infinite;
      will-change: transform;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .hero-floating-badge:hover .icon-marquee-track {
      animation-play-state: paused;
    }

    .icon-marquee-track img {
      height: 22px;
      width: 22px;
      object-fit: contain;
      filter: brightness(0) invert(1);
      opacity: 0.78;
      flex-shrink: 0;
      transition: opacity 0.2s, transform 0.2s;
    }

    .icon-marquee-track img:hover {
      opacity: 1;
      transform: scale(1.18);
      filter: none;
    }

    @keyframes icon-marquee {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    .hero-copy .glass-pill {
      background: rgba(15, 23, 42, 0.65) !important;
      backdrop-filter: blur(16px) saturate(150%) !important;
      -webkit-backdrop-filter: blur(16px) saturate(150%) !important;
      border: 1px solid rgba(255, 255, 255, 0.18) !important;
      color: #FFFFFF !important;
      padding: 0.45rem 0.95rem;
      /* Match .hero-floating-badge (height: 42px) so both pills in the row align. */
      height: 42px;
      display: inline-flex;
      align-items: center;
    }

    .hero-copy .glass-pill > span:last-child {
      font-size: 0.85rem;
    }

    /* Hero CTAs only. Excluding .glass-pill is essential: the greeting badge also
       carries .droplet-btn, so an unscoped min-height: 3.25rem (52px) overrode the
       42px height set in the .glass-pill rule below and left the two pills in the
       greeting row misaligned (52px vs the 42px marquee badge). */
    .hero-copy .droplet-btn:not(.droplet-btn-secondary):not(.glass-pill) {
      min-height: 3.25rem;
      padding: 0.85rem 1.6rem;
      background: linear-gradient(135deg, #0284C7 0%, #0369A1 100%);
      border: 1px solid rgba(56, 189, 248, 0.3);
      box-shadow: 0 8px 24px -6px rgba(2, 132, 199, 0.6);
      color: #FFFFFF;
    }

    .hero-copy .droplet-btn:not(.droplet-btn-secondary):not(.glass-pill):hover {
      background: linear-gradient(135deg, #0369A1 0%, #075985 100%);
      box-shadow: 0 12px 28px -6px rgba(2, 132, 199, 0.7);
    }

    .hero-copy .droplet-btn-secondary {
      min-height: 3.25rem;
      padding: 0.85rem 1.6rem;
      background: rgba(255, 255, 255, 0.10) !important;
      backdrop-filter: blur(16px) saturate(150%) !important;
      -webkit-backdrop-filter: blur(16px) saturate(150%) !important;
      border: 1px solid rgba(255, 255, 255, 0.22) !important;
      color: #FFFFFF !important;
    }

    .hero-copy .droplet-btn-secondary:hover {
      background: rgba(255, 255, 255, 0.18) !important;
      border-color: rgba(56, 189, 248, 0.45) !important;
      color: #FFFFFF !important;
    }

    .hero-copy > div > div:last-child {
      gap: 0.5rem;
    }

    .hero-copy > div > div:last-child ul {
      background: rgba(15, 23, 42, 0.65) !important;
      backdrop-filter: blur(16px) saturate(150%) !important;
      -webkit-backdrop-filter: blur(16px) saturate(150%) !important;
      border: 1px solid rgba(255, 255, 255, 0.16) !important;
      padding: 0.35rem 0.5rem;
      border-radius: 9999px;
    }

    .hero-copy > div > div:last-child ul a {
      width: 2.35rem;
      height: 2.35rem;
      color: rgba(241, 245, 249, 0.85) !important;
    }

    .hero-copy > div > div:last-child ul a:hover {
      color: #38BDF8 !important;
      background: rgba(56, 189, 248, 0.16) !important;
    }

    .hero-copy > div > div:last-child ul svg {
      width: 1.15rem;
      height: 1.15rem;
    }

    /* Tablet breakpoint (768px - 1024px) */
    @media (min-width: 768px) and (max-width: 1024px) {
      .hero-copy {
        width: min(55%, 540px);
        margin-left: 1.5rem;
        padding-top: 3.5rem;
      }
      .hero-image {
        right: 0;
        height: 100%;
        width: auto;
        max-width: 65vw;
        object-fit: contain;
        object-position: right center;
      }
      .hero-content-overlay {
        background: linear-gradient(
          to right,
          rgba(7, 11, 20, 0.95) 0%,
          rgba(7, 11, 20, 0.82) 38%,
          rgba(7, 11, 20, 0.30) 62%,
          transparent 100%
        );
      }
      .hero-floating-badge {
        bottom: 2rem;
        right: 1.5rem;
      }
    }

    /* Mobile breakpoint (< 768px) */
    @media (max-width: 767px) {
      #home {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: flex-start;
        padding-bottom: 1.75rem;
        padding-top: 5.5rem;
      }

      .hero-background {
        position: absolute;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }

      .hero-image {
        position: absolute;
        top: 52px;
        left: 50%;
        right: auto;
        transform: translateX(-50%);
        width: 95%;
        max-width: 440px;
        height: 48svh;
        object-fit: contain;
        object-position: center top;
        mask-image: linear-gradient(to bottom, #000 75%, transparent 100%);
        -webkit-mask-image: linear-gradient(to bottom, #000 75%, transparent 100%);
      }

      .hero-content-overlay {
        background: linear-gradient(
          to top,
          rgba(7, 11, 20, 0.99) 0%,
          rgba(7, 11, 20, 0.95) 45%,
          rgba(7, 11, 20, 0.45) 70%,
          transparent 100%
        );
      }

      .hero-copy {
        width: 100%;
        margin-left: 0;
        padding: 0.75rem 1rem 0;
      }

      .hero-copy h1 {
        font-size: clamp(1.85rem, 7vw, 2.4rem);
        line-height: 1.1;
        margin-bottom: 0.65rem;
      }

      .hero-copy h3 {
        font-size: 0.92rem;
        line-height: 1.55;
        margin-bottom: 1rem;
        max-width: 100%;
      }

      .hero-floating-badge {
        display: none;
      }

      /* The greeting badge is a pill, not a CTA: let it hug its own text and stay
         centred. The old `width: 100%` rule here also matched it, because the badge
         carries .droplet-btn as well, and stretched it into a full-width bar. */
      .hero-copy .glass-pill {
        width: auto;
        align-self: center;
      }

      /* Hide the core tech tags on phones/tablets. Stacked under a 2-line heading
         they pushed the CTAs below the fold; the skills section already lists the
         same stack with icons. Reappears from 768px up (`md:justify-start` row).
         `!important` is required: the Tailwind Play CDN injects its `.flex`
         utility into <head> *after* this inline stylesheet, so an equally
         specific `display: none` would lose the cascade. */
      .hero-copy .hero-tech-pills {
        display: none !important;
      }
    }

    @media (max-width: 420px) {
      .hero-copy {
        padding-inline: 1rem;
      }
      .hero-copy h1 {

    //   skills:  [{name,img}]            OR [{name,icon}]
    //   projects:[{name,desc,images,demoUrl}] OR [{title,description,screenshots,url}]
    //   about:   [{title,text}]          OR timeline:[{title,description}]
    const normalizeContent = (data) => {
      if (!data || typeof data !== 'object') return null;

      const imageMap = {};
      if (Array.isArray(data.site_images)) {
        data.site_images.forEach(image => { imageMap[image.slot] = image.image_url; });
      }
      const images = data.images || {};

      return {
        images: {
          hero: resolveMediaUrl(images.hero || imageMap.hero || ''),
          about: resolveMediaUrl(images.about || imageMap.about || '')
        },
        skills: (data.skills || []).map(skill => ({
          name: skill.name,
          img: resolveMediaUrl(skill.img || skill.icon || '')
        })),
        projects: (data.projects || []).map(project => ({
          name: project.name || project.title || '',
          desc: project.desc || project.description || '',
          images: (project.images || project.screenshots || [])
            .map(image => (typeof image === 'string' ? image : image.image_url))
            .filter(Boolean)
            .map(resolveMediaUrl),
          demoUrl: project.demoUrl || project.url || '#'
        })),
        about: (data.about || data.timeline || []).map(item => ({
          title: item.title || '',
          text: item.text || item.description || ''
        }))
      };
    };

    const applyContent = (data, staticFallback) => {
      const normalized = normalizeContent(data);
      if (!normalized) return;

      // Some existing admin records publish only a bare filename (for example,
      // "news-home.png"). Those resolve from the site root and 404. When a
      // project matches the published static content, use its known-good image
      // paths while keeping the API's project title, description, and URL.
      const fallback = normalizeContent(staticFallback);
      if (fallback?.images?.hero) normalized.images.hero = fallback.images.hero;
      if (fallback?.images?.about) normalized.images.about = fallback.images.about;
      // Fold the HSC achievement into the existing education entry, including
      // when an older API timeline still contains the standalone milestone.
      const about = (normalized.about.length ? normalized.about : (fallback?.about || []))
        .filter(item => !/higher secondary certificate|\bhsc\b/i.test(item.title || ''));
      const education = about.find(item => /^education\b/i.test((item.title || '').trim()));
      if (education) {
        education.text = 'I completed my Higher Secondary Certificate (HSC) in the Arts stream in 2026. Now that I’m more financially stable, I plan to enroll in a diploma in Computer Science.';
      }
      normalized.about = about;

      if (fallback?.projects?.length) {
        const projectKey = name => String(name || '').toLowerCase().replace(/[^a-z0-9]/g, '');
        const fallbackProjects = new Map(
          fallback.projects.map(project => [projectKey(project.name), project])
        );

        normalized.projects = normalized.projects.map(project => {
          const hasBareFilenames = project.images.some(image =>
            image && !image.includes('/') && !/^(?:[a-z][a-z0-9+.-]*:)?\/\//i.test(image)
          );
          const fallbackProject = fallbackProjects.get(projectKey(project.name));

          if (!hasBareFilenames) return project;
          if (fallbackProject?.images?.length) {
            return { ...project, images: fallbackProject.images };
          }

          // Keep any usable API paths, but don't request bare filenames known to
          // resolve to 404s at the site root when no static match is available.
          return {
            ...project,
            images: project.images.filter(image =>
              image.includes('/') || /^(?:[a-z][a-z0-9+.-]*:)?\/\//i.test(image)
            )
          };
        });
      }

      // Keep Doc-Flip first even when the admin API returns a project list that
      // predates the static portfolio data.
      const docFlip = fallback?.projects?.find(project =>
        String(project.name || '').toLowerCase().replace(/[^a-z0-9]/g, '') === 'docflip'
      );
      if (docFlip) {
        normalized.projects = [
          docFlip,
          ...normalized.projects.filter(project =>
            String(project.name || '').toLowerCase().replace(/[^a-z0-9]/g, '') !== 'docflip'
          )
        ];
      }

      window.portfolioContent = normalized;
      window.dispatchEvent(new Event('portfolio-content-ready'));
    };

    const fetchJson = (url) => fetch(url, { cache: 'no-store' })
      .then(response => response.ok ? response.json() : null)
      .catch(() => null);

    Promise.all([fetchJson(MANIFEST_ENDPOINT), fetchJson(STATIC_CONTENT)])
      .then(([manifest, staticContent]) => {
        // The API returns an {error} / empty object when the DB is unavailable,
        // so fall back to the published JSON rather than rendering blank content.
        const hasData = manifest && (
          Object.keys(manifest.images || {}).length ||
          (manifest.skills || []).length ||
          (manifest.projects || []).length
        );
        applyContent(hasData ? manifest : staticContent, staticContent);
      })
      .catch(() => {});
  </script>

    const App = () => {
      const [, refreshContent] = React.useState(0);

      React.useEffect(() => {
        const refresh = () => refreshContent(value => value + 1);
        window.addEventListener('portfolio-content-ready', refresh);
        return () => window.removeEventListener('portfolio-content-ready', refresh);
      }, []);

      React.useEffect(() => {
        const targets = document.querySelectorAll('[data-reveal]');

        if (!('IntersectionObserver' in window)) {
          targets.forEach(target => target.classList.add('reveal-visible'));
          return undefined;
        }

        const observer = new IntersectionObserver((entries, currentObserver) => {
          entries.forEach(entry => {
            if (!entry.isIntersecting) return;
            entry.target.classList.add('reveal-visible');
            currentObserver.unobserve(entry.target);
          });
        }, {
          threshold: 0.12,
          rootMargin: '0px 0px -40px 0px'
        });

        targets.forEach(target => observer.observe(target));
        return () => observer.disconnect();
      }, []);
